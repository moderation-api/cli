name: Command docs

# Regenerates docs/ (linked from the README's command list) after every
# change on main, so the docs follow each Speakeasy regeneration.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: command-docs
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Generate docs
        run: |
          rm -rf docs
          go run ./cmd/gendocs docs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "Docs are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: regenerate command docs"
          git push
