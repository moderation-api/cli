# Maintained in moderation-api/sdk-generator (custom/cli). Edits here are overwritten.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      # The generated models keep json tags on unexported constant fields on purpose.
      - run: go vet -structtag=false ./...
      - name: Run the binary
        run: go run ./cmd/modapi --help > /dev/null
