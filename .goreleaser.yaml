# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: modapi

before:
  hooks:
    - go mod tidy

builds:
  - id: modapi
    main: ./cmd/modapi
    binary: modapi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildTime={{.Date}}

archives:
  - id: modapi
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

release:
  github:
    owner: moderation-api
    name: cli
  draft: false
  prerelease: auto
  mode: append

checksum:
  name_template: "checksums.txt"

brews:
  - name: modapi
    repository:
      owner: moderation-api
      name: homebrew-tap
      branch: main
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    directory: Formula
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "") "" }}true{{ end }}'
    homepage: "https://github.com/moderation-api/cli"
    description: "Moderation API CLI: moderate content and manage your setup from the terminal"
    license: "Apache-2.0"
    install: |
      bin.install "modapi"
    test: |
      system "#{bin}/modapi", "--version"
